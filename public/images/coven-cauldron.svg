  <ellipse cx="80" cy="66" rx="44" ry="5" fill="#C2632A"/>
  <!-- bubbles -->
  <circle cx="66" cy="56" r="6" fill="#C2632A"/>
  <circle cx="90" cy="52" r="8" fill="#C2632A"/>
  <circle cx="104" cy="58" r="4" fill="#C2632A"/>
  <circle cx="88" cy="50" r="2.5" fill="#F5F3F0" opacity="0.7"/>
  <!-- sheen -->
  <path d="M46 84c2 14 8 24 16 30" fill="none" stroke="#F5F3F0" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
